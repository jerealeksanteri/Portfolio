<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog &middot; Jere Niemi</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="blog-header">
        <a href="./index.html" class="back-link">&lt; .blog</a>
        <h1 id="post-title" class="post-title">Loading...</h1>
        <div class="post-meta">
            <time id="post-date"></time>
            <span id="post-tags" class="post-tags"></span>
        </div>
    </header>

    <main class="blog-main">
        <article id="post-body" class="post-body"></article>
        <p id="post-error" class="post-error" hidden>Post not found.</p>
    </main>

    <footer class="blog-footer">
        <a href="./index.html" class="back-link">&lt; back to all posts</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
    <script src="post.js"></script>
</body>
</html>
